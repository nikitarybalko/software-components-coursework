spring:
  datasource:
    url: jdbc:h2:mem:wargametest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

wargame:
  security:
    blue-api-key: blue-secret-token
    red-api-key: red-secret-token
    admin-api-key: admin-secret-token
  simulation:
    tick-timeout-ms: 1000
    snapshot-interval: 2
