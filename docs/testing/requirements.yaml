# Каталог вимог Wargame Broker.
# Джерело FR-1…FR-9 та NFR-1…NFR-6 — Requirements Traceability Matrix, здана в Classroom.
# NFR-7 у RTM помилково мав ідентифікатор FR-7. FR-10 та FR-11 додано під час розробки.

- id: FR-1
  type: functional
  subsystem: Модуль синхронізації
  description: >-
    Система повинна надавати REST-ендпоінти для реєстрації симуляторів (Blue Force, Red Force)
    та виступати арбітром часу (Tick Management), очікуючи дані від обох сторін перед початком наступного кроку

- id: FR-2
  type: functional
  subsystem: API-шлюз та Валідатор
  description: Система повинна приймати дані про стан юнітів (бойових одиниць) у форматі JSON та валідувати їх

- id: FR-3
  type: functional
  subsystem: Ядро обчислень видимості
  description: >-
    Система повинна розраховувати відстань між юнітами та повертати кожному симулятору
    лише тих ворогів, які потрапляють у радіус огляду (Туман війни)

- id: FR-4
  type: functional
  subsystem: Підсистема збереження стану
  description: Система повинна зберігати "зліпок" (snapshot) поточного стану поля бою у БД кожні N кроків

- id: FR-5
  type: functional
  subsystem: Підсистема логування
  description: Система повинна зберігати в БД реєстр критичних подій (наприклад, знищення юніта)

- id: FR-6
  type: functional
  subsystem: Модуль моніторингу з'єднань
  description: >-
    Система повинна призупиняти симуляцію, якщо клієнт не відповідає більше заданого тайм-ауту,
    та надавати ендпоінт для відновлення стану

- id: FR-7
  type: functional
  subsystem: Модуль безпеки
  description: >-
    Система повинна використовувати базову автентифікацію (наприклад, API-ключі або статичні токени)
    для ідентифікації "Синіх" та "Червоних", щоб запобігти несанкціонованому втручанню

- id: FR-8
  type: functional
  subsystem: Модуль синхронізації та сесій
  description: >-
    Система повинна надавати REST-ендпоінт для ініціалізації або скидання (Reset) симуляції,
    який очищує поточний стан, кеш та готує БД до нового бою

- id: FR-9
  type: functional
  subsystem: Ядро обчислень видимості
  description: >-
    Система повинна підтримувати динамічні властивості видимості (наприклад, якщо у вхідному JSON
    статус юніта вказано як "пошкоджений", його радіус огляду програмно зменшується)

- id: FR-10
  type: functional
  subsystem: Дашборд Командира
  description: >-
    Система повинна надавати веб-інтерфейс командира для візуалізації поля бою, зон видимості
    та керування життєвим циклом симуляції (ініціалізація, пауза, скидання, відновлення)

- id: FR-11
  type: functional
  subsystem: API-шлюз та Підсистема збереження стану
  description: >-
    Система повинна приймати тип бойової одиниці (танковий, механізована піхота, піхота, розвідка),
    зберігати його у snapshot та передавати клієнтам; за відсутності типу використовується UNKNOWN

- id: NFR-1
  type: non-functional
  subsystem: Інфраструктура проєкту
  description: Бекенд має бути реалізований на Java та Spring Boot

- id: NFR-2
  type: non-functional
  subsystem: Інфраструктура бази даних
  description: Збереження даних має відбуватися у реляційній БД PostgreSQL

- id: NFR-3
  type: non-functional
  subsystem: Мережевий рівень (контролери)
  description: Формат обміну даними між мікросервісом та симуляторами - виключно REST API (application/json)

- id: NFR-4
  type: non-functional
  subsystem: Контейнеризація
  description: Програмний продукт та БД повинні розгортатися єдиною командою через docker-compose

- id: NFR-5
  type: non-functional
  subsystem: Ядро обчислень видимості
  description: >-
    Алгоритмічна складність розрахунку просторової видимості (Туману війни) не повинна перевищувати O(N * M),
    де N та M - кількість юнітів протиборчих сторін

- id: NFR-6
  type: non-functional
  subsystem: DevOps / Контейнеризація
  description: >-
    Використання оперативної пам'яті Docker-контейнером мікросервісу має бути обмежене
    для запобігання витокам пам'яті під час тривалих симуляцій

- id: NFR-7
  type: non-functional
  subsystem: Інфраструктура проєкту
  description: >-
    Всі REST-ендпоінти мікросервісу повинні бути задокументовані за допомогою специфікації OpenAPI (Swagger UI)
    для зручного інтерактивного тестування
